name: IASTARK - Teste inicial

on:
  workflow_dispatch:
    inputs:
      autorizar_internet:
        description: "Autorizar leitura e armazenamento de noticias publicas nesta execucao"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: iastark-memoria-${{ github.ref }}
  cancel-in-progress: false

jobs:
  executar:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.IASTARK_COLETA_AUTOMATICA == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      IASTARK_AUTORIZAR_INTERNET: ${{ github.event_name == 'schedule' || inputs.autorizar_internet }}

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Iniciar IASTARK
        run: python iastark.py

      - name: Guardar memoria no GitHub
        if: ${{ env.IASTARK_AUTORIZAR_INTERNET == 'true' }}
        shell: bash
        run: |
          test -f dados/noticias.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dados/noticias.json
          if git diff --cached --quiet; then
            echo "A memoria ja esta atualizada."
          else
            git commit -m "Atualizar memoria de noticias publicas"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Memoria salva no GitHub."
          fi
